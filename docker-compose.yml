services:
  targetranger-app:
    build: .
    image: maayanlab/targetranger:0.5.0
    pull_policy: if_not_present
    platform: linux/amd64
    ports:
    - 3000
    x-kubernetes:
      annotations:
        maayanlab.cloud/ingress: https://targetranger.maayanlab.cloud
        nginx.ingress.kubernetes.io/proxy-body-size: '100M'
    deploy:
      resources:
        limits:
          cpus: '.25'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 512M
    restart: unless-stopped
    environment:
    - DATABASE_URL=${PROD_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@targetranger-db-2:5432/postgres?sslmode=disable}
    - NEXT_PUBLIC_DOWNLOADS
    - NEXT_PUBLIC_ENTRYPOINT
    - NEXT_PUBLIC_GENERANGERURL
    - NEXT_PUBLIC_TARGETRANGERURL

  targetranger-db-2:
    build:
      context: ETL
      dockerfile: Dockerfile.pg14
      platforms:
      - linux/amd64
    image: maayanlab/postgres-py:14.24
    pull_policy: if_not_present
    platform: linux/amd64
    ports:
    - 5438:5432
    environment:
    - POSTGRES_PASSWORD
    volumes:
    - targetranger-db-2:/var/lib/postgresql/data

volumes:
  targetranger-db-2:
    x-kubernetes:
      className: gp2
      size: 25Gi

x-kubernetes:
  name: targetranger
